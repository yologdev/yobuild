# A web researcher: it answers a question from the web, briefly, with the
# sources it used, and asks the owner to narrow a question that is too broad.
# It only reads the web: its local tools are read-only (run it in an empty folder).

[agent]
name   = "web-research"
model  = "deepseek/deepseek-flash"
prompt = "prompts/agent.md"

[limits]
max_turns  = 20
budget_usd = 0.5          # per question (per run)

[[plugin]]
dsh    = "dsh-free-search@0.8.1"
config = { provider = "bing", disabledEngines = [], bingMarket = "en-US" }
allow  = [
  "multi_search", "research", "advanced_search", "domain_search", "platform_search",
  "video_search", "cache_search",
]

[builtins]
ask_owner = true
report    = ["Short answer", "Sources used", "Waiting on you"]
gate      = "allow-list"
tools     = "read-only"

[frontend]
web = true
