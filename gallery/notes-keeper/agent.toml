# Answers questions about the markdown notes in the folder it is started in,
# and tidies them up through the official MCP filesystem server. Every
# change, new file or move asks the owner first (Allow/Block on the page).
#
#   cd ~/notes && DEEPSEEK_API_KEY=… path/to/yobuild run path/to/notes-keeper/agent.toml

[agent]
name   = "notes-keeper"
model  = "deepseek/deepseek-flash"
prompt = "prompts/agent.md"

[limits]
max_turns          = 40
budget_usd         = 0.25     # dollars per run
session_budget_usd = 1.0      # dollars across everything until yobuild stops

[[mcp]]
name  = "files"
npm   = "@modelcontextprotocol/server-filesystem@1.0.0"
args  = ["."]                  # the folder yobuild run starts in: the notes folder
allow = [
  "read_file", "read_text_file", "read_media_file", "read_multiple_files",
  "list_directory", "list_directory_with_sizes", "directory_tree",
  "search_files", "get_file_info", "list_allowed_directories",
]
# write_file, edit_file, create_directory, move_file are left out:
# each call asks the owner first.

[builtins]
gate  = "allow-list"           # the default: anything not allowed asks
tools = "read-only"            # yoagent's own tools only read, inside the notes folder; no bash

[frontend]
web = true
