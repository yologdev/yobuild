[package]
name = "yobuild"
version = "0.1.0"
edition = "2021"
resolver = "3"
description = "Build an agent by choosing its parts: plugins from other ecosystems on the yoagent loop, a few built-ins of its own, and a frontend"
license = "MIT"
repository = "https://github.com/yologdev/yobuild"
rust-version = "1.88"
readme = "README.md"
homepage = "https://github.com/yologdev/yobuild"
keywords = ["agent", "llm", "plugins", "mcp", "cli"]
categories = ["command-line-utilities", "development-tools"]
# A binary first (`cargo install yobuild`); the library is what its tests
# use, with no API promise before 1.0 (design §13 "Distribution").
#
# What the crate ships: the sources and what the binary builds in
# (`include_bytes!`/`include_str!`: the web page, the frontend's plugins,
# the gallery, the examples' manifests, the skill) — not the tests, the
# docs, the scripts or any `node_modules`.
include = [
    "/src/**/*.rs",
    "/frontend/web/index.html",
    "/frontend/web/app.js",
    "/frontend/web/lib.js",
    "/frontend/web/package.json",
    "/frontend/plugins/package.json",
    "/frontend/plugins/package-lock.json",
    "/frontend/plugins/*.ts",
    "/frontend/plugins/pi-extensions/confirm-dangerous.ts",
    "/gallery/**/*",
    "/examples/*.toml",
    "/examples/*.lock",
    "/examples/prompts/*.md",
    "/examples/scripts/*.json",
    "/examples/scripts/*.task",
    "/skill/yobuild/**/*.md",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

# Prebuilt binaries for `cargo binstall yobuild`, as the release workflow
# names them (`.github/workflows/release.yml`).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/yobuild-v{ version }-{ target }.tar.gz"
bin-dir = "yobuild-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"


[dependencies]
# The built-ins implement yoagent's `AgentTool` and `Extension` (async traits).
async-trait = "0.1"
# DshHome: a private, per-process home for DSH's own services.
tempfile = "3"
# Floors: 0.25.10 (DeepSeek priced; an MCP tool prefix applied; every text
# block of a tool result sent to the model; `ModelConfig::preset`/`generic`;
# steering a cancelled run took kept in the history); 0.7 (pi's `exec`
# closed by default; rutis
# 0.12; hook timings; which plugin offered a tool, by its row; pi's
# `nestedCalls`), whose adapters `scripts/copy-adapters.sh` copies (and
# whose `adapters()` names the crate's own files, read in place:
# `dsh/host-services.json`). rutis 0.12 throughout: the runtimes
# (`frontend/plugins`, the adapters') must match.
yoagent = "0.26.1"
yoagent-rutis = { version = "0.10", features = ["node", "loader", "probe", "embedded-adapters"] }
rutis = "0.12"
rutis-bridge = { version = "0.12", default-features = false, features = ["node"] }
rutis-loader = { version = "0.12", features = ["node"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The agent manifest (design §2).
toml = "0.8"
# MCP and model endpoints: their host is compared exactly.
url = "2"
# `find_plugin`'s sources: the MCP registry and npm's downloads (yoagent
# brings it already).
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "process", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
# The `yobuild` binary's log (stderr, or a file under a terminal UI).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# A cache folder's name: the hash of its set in `agent.lock`.
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# Whether this user may run a program (`access(X_OK)`), asked before it is
# started through `/usr/bin/env` (`frontend::host::startable`).
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
tokio-tungstenite = "0.28"
tempfile = "3"
