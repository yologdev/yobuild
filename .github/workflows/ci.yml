name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # The crate and its examples. The session and web tests need no Node; the
  # pi and DSH dialog tests need the adapters' packages (required here). The
  # examples run headless with three Node runtimes (the UI's, pi's and DSH's
  # packages), on a pseudo-terminal, and as the scripted handoff demo.
  check:
    name: Check & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # The adapters' locks come with the yoagent-rutis version Cargo.lock pins.
          cache-dependency-path: |
            frontend/plugins/package-lock.json
            Cargo.lock
      - name: Node and npm versions
        run: node --version && npm --version
      - name: Copy the adapters of the yoagent-rutis crate (adapters/)
        run: scripts/copy-adapters.sh
      - name: Install the npm packages
        run: |
          npm ci --prefix frontend/plugins
          npm ci --prefix adapters/pi
          npm ci --prefix adapters/dsh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Docs
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --locked --no-deps
      - name: No global TypeScript (pi-lens 4.4.3's server is unavailable beside one)
        # The runner has `tsc` on PATH; pi-lens then takes it rather than
        # installing its own, finds no tsserver it admits, and its probe
        # comes back unconfirmed (the code-health gallery agent).
        run: |
          for b in $(which -a tsc tsserver 2>/dev/null); do
            echo "removing $b"; rm -f "$b" 2>/dev/null || sudo rm -f "$b"
          done
          ! command -v tsc
      - name: Test (pi's and DSH's dialogs through the session need the runtimes)
        # The tests' package cache starts empty, so every install really runs,
        # and pi-lens's servers are fetched (the build cache may bring
        # target/tmp back).
        run: |
          rm -rf target/tmp/yobuild-home target/tmp/pi-lens-home
          YOAGENT_RUTIS_REQUIRE_RUNTIMES=1 cargo test --locked
      - name: pi-lens's logs, on failure
        if: failure()
        run: |
          d=target/tmp/pi-lens-home/.pi-lens
          ls -la $d $d/tools $d/bin 2>&1 | head -40
          for f in $d/*.log; do echo "== $f"; grep -iE 'typescript|tsserver|broken|spawn failure|install' "$f" | head -80; done
          ls $d/tools/node_modules/.bin 2>&1 | head; node --version; which node
          find $d/projects -name '*.json' -newer $d/instances.json 2>/dev/null | head -5 | while read f; do echo "== $f"; head -c 3000 "$f"; echo; done
      - name: Page logic and the approval gate (node --test)
        run: node --test frontend/web/lib.test.js frontend/plugins/pi-extensions/confirm-dangerous.test.mjs
      - name: Example (scripted, headless; a pi dialog reaches the terminal UI)
        shell: bash
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-project" && cd "$RUNNER_TEMP/frontend-project"
          cargo run --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --example coding_agent -- --demo "clean the build" \
            | sed 's/\x1b\[[0-9;]*m//g' | tee screen.txt
          grep -q "? Run \`rm -rf build\`?" screen.txt
          grep -q "bash ✗" screen.txt
      # The real terminal mode, on a pseudo-terminal: the headless demo never
      # reads the keyboard, so it cannot see a UI runtime the OS stops for
      # touching the terminal from a process group of its own (since rutis 0.9).
      - name: Example (scripted, on a pseudo-terminal; the keyboard reaches the UI)
        shell: bash
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/pty-project" && cd "$RUNNER_TEMP/pty-project"
          cargo build --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --example coding_agent
          python3 "$GITHUB_WORKSPACE/tests/terminal_pty.py" \
            "$GITHUB_WORKSPACE/target/debug/examples/coding_agent"
      - name: yobuild run (a manifest with an MCP server, scripted, once)
        # bash's pipefail: the run's own exit code counts, not only tee's.
        shell: bash
        run: |
          cargo run --locked -- run tests/fixtures/echo/agent.toml \
            --scripted tests/fixtures/echo/script.json --once "echo hi" | tee run-out.txt
          grep -qx Completed run-out.txt
      - name: The terminal UI on a pty, given an answer with escape sequences and deceptive links (none reaches the terminal as one)
        # The plugin runtimes start through `env -u` with the kept
        # environment (design §12, "Step 5"), a credential among what is
        # taken out; scripted, so never sent anywhere.
        env:
          OPENAI_API_KEY: not-a-real-key
        timeout-minutes: 5
        run: |
          cargo build --locked
          python3 tests/terminal_text_pty.py target/debug/yobuild
      - name: yobuild run with the terminal UI on a pty (a typed task, Ctrl+C quits with 0, a dead UI is an error)
        # The plugin runtimes start through `env -u` with the kept
        # environment (design §12, "Step 5"), a credential among what is
        # taken out; scripted, so never sent anywhere.
        env:
          OPENAI_API_KEY: not-a-real-key
        timeout-minutes: 5
        run: |
          cargo build --locked
          python3 tests/run_terminal_pty.py target/debug/yobuild
      - name: The coding example (yobuild run examples/coding.toml) on a pty (its pi policy asks before rm -rf build, Block from the keyboard)
        # The plugin runtimes start through `env -u` with the kept
        # environment (design §12, "Step 5"), a credential among what is
        # taken out; scripted, so never sent anywhere.
        env:
          OPENAI_API_KEY: not-a-real-key
        shell: bash
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/pty-coding" && cd "$RUNNER_TEMP/pty-coding"
          python3 "$GITHUB_WORKSPACE/tests/terminal_pty.py" "$GITHUB_WORKSPACE/target/debug/yobuild" \
            run "$GITHUB_WORKSPACE/examples/coding.toml" --scripted "$GITHUB_WORKSPACE/examples/scripts/coding.json" --locked

  # Plugin runtimes and stdio servers start with the kept environment
  # through `/usr/bin/env -u` (design §12 "Step 4", "Step 5"): on macOS that
  # is BSD's `env`. The unit tests (the `=` path, the program looked for
  # first, the `DYLD_*` note), host_test's withheld-variable test (`node`
  # not on a runtime's `PATH`; a runtime's `DYLD_*`: the runners have System
  # Integrity Protection off, so it checks that `DYLD_*` arrives — the drop
  # itself, under SIP, only on a machine with it on), kept_env_test (the
  # kept set, grants, rutis's loopback channel token) and cli_test's server
  # that cannot start (its problem, fix and the `DYLD_*` note end to end).
  macos:
    name: Credentials on macOS
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/plugins/package-lock.json
      # Some unit tests read the adapters' row lists (`adapters/dsh/*.json`).
      - name: Copy the adapters of the yoagent-rutis crate (adapters/)
        run: scripts/copy-adapters.sh
      - name: Install the plugins' packages
        run: npm ci --prefix frontend/plugins
      - name: Unit tests
        run: cargo test --locked --lib
      - name: A withheld variable gone from every runtime
        run: YOAGENT_RUTIS_REQUIRE_RUNTIMES=1 cargo test --locked --test host_test a_withheld_variable_is_gone_from_every_runtime_unless_kept_or_set
      - name: The kept environment, rutis's loopback channel token among what arrives
        run: YOAGENT_RUTIS_REQUIRE_RUNTIMES=1 cargo test --locked --test kept_env_test
      - name: A server that cannot start, and the DYLD_* note, through the binary
        run: cargo test --locked --test cli_test a_server_that_cannot_start_is_said_with_what_to_do

  # Not supported on Windows yet (design §13 "Distribution"): `run` and
  # `check` refuse there. Kept compiling, for later.
  windows:
    name: Compiles on Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --locked

  # M4's "Done when" (design §13): yobuild runs without its repository. The
  # release binary, copied out, with the whole checkout then moved out of
  # reach (so no file read through a compiled-in path can pass), an empty
  # HOME and YOBUILD_HOME: the skill installed; a gallery agent with a DSH
  # plugin and an example with a pi policy and a built-in plugin, each
  # copied, checked and run scripted; the terminal UI on a pty.
  fresh-machine:
    name: Without the repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the release binary
        run: cargo build --release --locked
      - name: Copy it, and the terminal check, out of the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/check/tests/fixtures"
          cp target/release/yobuild "$RUNNER_TEMP/bin/"
          cp tests/run_terminal_pty.py "$RUNNER_TEMP/check/tests/"
          cp -r tests/fixtures/echo "$RUNNER_TEMP/check/tests/fixtures/"
      - name: Move the checkout out of reach
        run: mv "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE.away" && mkdir "$GITHUB_WORKSPACE"
      - name: No global TypeScript (as in the check job)
        run: |
          for b in $(which -a tsc tsserver 2>/dev/null); do rm -f "$b" 2>/dev/null || sudo rm -f "$b"; done
      - name: The skill, two agents and the terminal UI, from the binary alone
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/bin:$PATH" HOME="$RUNNER_TEMP/home" YOBUILD_HOME="$RUNNER_TEMP/yobuild-home"
          mkdir -p "$HOME" work
          yobuild --version
          yobuild skill install
          test -f "$HOME/.claude/skills/yobuild/SKILL.md"
          for agent in web-research coding; do
            yobuild new "agents/$agent" --from "$agent"
            yobuild check "agents/$agent/agent.toml" --locked
            (cd work && yobuild run "../agents/$agent/agent.toml" --scripted "../agents/$agent/scripts/demo.json" --locked --once "$(cat "../agents/$agent/scripts/demo.task")" | tee out.txt)
            tail -1 work/out.txt | grep -qx Completed
          done
          ls "$YOBUILD_HOME/runtime/adapters" "$YOBUILD_HOME/runtime/ui"
          python3 check/tests/run_terminal_pty.py "$RUNNER_TEMP/bin/yobuild"
      - name: Put the checkout back (for the cache's post step)
        if: always()
        run: |
          if [ -d "$GITHUB_WORKSPACE.away" ]; then rm -rf "$GITHUB_WORKSPACE" && mv "$GITHUB_WORKSPACE.away" "$GITHUB_WORKSPACE"; fi
