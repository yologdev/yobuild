name: Release

# On a version tag (`v0.1.0`): the binaries for macOS and Linux, each a
# tarball with its checksum, attached to a draft GitHub release named after
# the tag. Windows is not built (design §13). A person publishes the
# release, and publishing it publishes the crate (`publish.yml`), so the
# notes' `cargo install yobuild` works a few minutes later. Run by hand
# (workflow_dispatch) it builds and checks the crate, and drafts nothing.
# A tag with a `-` (`v0.2.0-rc.1`) is drafted as a pre-release, which
# `publish.yml` leaves off crates.io. Run again on a tag whose draft
# exists, it replaces the draft's files; a published release is not
# touched.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          # Intel macOS, cross-built on Apple silicon (the macOS 13 image is retired).
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: The tag is the crate's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          name="yobuild-v$version-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/yobuild" README.md LICENSE CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: yobuild-*.tar.gz*
          if-no-files-found: error

  # The crate as crates.io would get it builds: every file it builds in is
  # in Cargo.toml's `include`.
  crate:
    name: The packaged crate builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Every target's tarball and checksum
        run: |
          # 4 targets (the build matrix), a tarball and a checksum each.
          n=$(ls dist | wc -l)
          [ "$n" -eq 8 ] || { echo "::error::expected 8 files, found $n: $(ls dist)"; exit 1; }
      - name: Draft the release, the binaries attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::$GITHUB_REF_NAME is already published: its files are left as they are"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft $pre --title "yobuild $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Needs Node 22.19+ and npm 11.19+ for plugins. Install: download the tarball for your platform (macOS or Linux), or \`cargo install yobuild\` (\`cargo binstall yobuild\` downloads the tarball)."
