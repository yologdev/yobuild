name: Publish to crates.io

# When a release is published (not a pre-release): the crate at the
# release's tag, which must be Cargo.toml's version, goes to crates.io by
# the repository's `CARGO_REGISTRY_TOKEN` secret when it is set, else by
# trusted publishing — the crate's settings on crates.io then name this
# repository, this workflow and the `crates-io` environment, and
# crates-io-auth-action trades the job's GitHub identity for a token that
# lasts 30 minutes. (v0.2.0's run found no trusted-publishing entry, so the
# token was stored again.) A version already on crates.io
# is skipped, said as a notice. If publishing fails, the release's notes
# say the crate is not on crates.io yet, with the run. Run by hand with a
# tag, it publishes that tag: for a release whose run failed, or a tag made
# before this workflow (a release runs the workflow of its tag's commit).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to publish (v0.2.0)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write # trusted publishing
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      STORED: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - name: The tag is a version tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::not a version tag: $TAG"; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: The tag is the crate's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::the tag is $TAG, Cargo.toml says $version"
            exit 1
          fi
      - name: Not on crates.io yet
        id: new
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "yobuild-publish (github.com/yologdev/yobuild)" \
            "https://crates.io/api/v1/crates/yobuild/${TAG#v}")
          case "$code" in
            200) echo "::notice::yobuild ${TAG#v} is already on crates.io: nothing to publish"
                 echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::warning::crates.io answered $code for yobuild ${TAG#v}: publishing anyway"
                 echo "publish=true" >> "$GITHUB_OUTPUT" ;;
          esac
      # Pinned to commits: every step of this job can ask for the token.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.new.outputs.publish == 'true'
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.new.outputs.publish == 'true' && env.STORED != 'true'
        id: auth
      - name: cargo publish
        if: steps.new.outputs.publish == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  # A published release whose crate did not follow says so on the release,
  # since its notes give `cargo install yobuild`.
  said:
    name: Say the crate is missing
    needs: publish
    if: failure() && github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          notes=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body)
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$notes

          **Not on crates.io yet:** publishing the crate failed ($RUN); until it is, download the tarball."
          echo "::error::yobuild $TAG is released, but its crate was not published: $RUN"
