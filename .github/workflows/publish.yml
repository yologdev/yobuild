name: Publish to crates.io

# When a release is published (yoagent's own workflow, the same way): the
# crate at the release's tag, which must be Cargo.toml's version, goes to
# crates.io with the repository's `CARGO_REGISTRY_TOKEN`. Run by hand with
# a tag, it publishes that tag: for one made before this workflow existed
# (v0.1.0), since a release runs the workflow of its tag's commit.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to publish (v0.1.0)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: The tag is a version tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::not a version tag: $TAG"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag is the crate's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::the tag is $TAG, Cargo.toml says $version"
            exit 1
          fi
      - name: cargo publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
