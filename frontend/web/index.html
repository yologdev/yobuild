<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yoagent</title>
<style>
  :root {
    --bg: #f6f7f5; --panel: #ffffff; --ink: #18211d; --muted: #5d6b64;
    --line: #dde3df; --accent: #2340d0; --ok: #1f8a4c; --bad: #c8323c; --warn: #b7791f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161a; --panel: #171e23; --ink: #e3e9e6; --muted: #93a29b;
      --line: #27323a; --accent: #8ea2ff; --ok: #4cc58a; --bad: #f2727b; --warn: #e5b45c;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  }
  header b { font-size: 16px; }
  header span { color: var(--muted); font-size: 13px; }
  #status { margin-left: auto; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #panels { width: min(340px, 40%); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px; }
  #panels:empty { display: none; }
  .you { color: var(--accent); font-weight: 600; white-space: pre-wrap; }
  .answer { max-width: 72ch; overflow-wrap: anywhere; }
  .answer > :first-child { margin-top: 0; } .answer > :last-child { margin-bottom: 0; }
  .answer p, .answer ul, .answer ol, .answer pre, .answer blockquote, .answer .table { margin: 0 0 8px; }
  .answer li > p, .answer li > ul, .answer li > ol { margin: 2px 0; }
  .answer ul, .answer ol { padding-left: 1.4em; }
  .answer h1, .answer h2, .answer h3, .answer h4, .answer h5, .answer h6 { margin: 14px 0 6px; line-height: 1.3; }
  .answer h1 { font-size: 1.3em; } .answer h2 { font-size: 1.15em; } .answer h3 { font-size: 1.05em; }
  .answer h4, .answer h5, .answer h6 { font-size: 1em; }
  .answer code { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; }
  .answer pre { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; position: relative; overflow-wrap: normal; }
  .answer pre code { border: 0; padding: 0; background: none; white-space: pre; }
  .answer pre[data-lang]::before { content: attr(data-lang); display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .answer blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
  .answer hr { border: 0; border-top: 1px solid var(--line); }
  .answer .table { overflow-x: auto; max-width: 100%; }
  .answer table { border-collapse: collapse; overflow-wrap: normal; }
  .answer th, .answer td { border: 1px solid var(--line); padding: 3px 8px; }
  .answer th { background: var(--panel); }
  .tool { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted); display: flex; gap: 6px; min-width: 0; }
  .tool .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tool .ok, .tool .bad { flex: none; }
  .tool .ok { color: var(--ok); } .tool .bad { color: var(--bad); }
  .rendered { margin: 4px 0 0 18px; }
  .notice { color: var(--warn); font-size: 13px; }
  .notice.error, .end.error { color: var(--bad); }
  .end { color: var(--muted); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea {
    flex: 1; resize: none; height: 44px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit;
  }
  button {
    padding: 0 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { margin: 2px 0 0 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 8px 10px; max-width: 100%; overflow-x: auto; font-size: 13px; }
  .card .head { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
  .card .note, .card .more { color: var(--muted); font-size: 12px; }
  .card pre { margin: 6px 0; font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre; }
  .card .add { color: var(--ok); } .card .del { color: var(--bad); }
  .card ol { margin: 4px 0; padding-left: 20px; }
  .card a { color: var(--accent); }
  dialog label.choice { display: block; margin: 4px 0; }
  dialog label.choice input { width: auto; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); max-width: 420px; width: calc(100% - 32px); }
  /* Docked above the composer, not modal: the page stays usable while a question waits. */
  dialog:not(:modal) { position: fixed; left: 0; right: 0; bottom: 76px; margin: 0 auto; z-index: 10; box-shadow: 0 8px 30px rgba(0, 0, 0, .45); max-height: 60vh; overflow-y: auto; }
  dialog .count { color: var(--muted); font-size: 12px; }
  dialog .count:empty { display: none; }
  body.asking #log { padding-bottom: 45vh; }
  dialog h3 { margin: 0 0 6px; font-size: 16px; }
  /* A question's details as written: a command's lines stay lines. */
  dialog p.message { white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  dialog input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
</style>
</head>
<body>
<header>
  <b>yoagent</b><span>loop in Rust · this page is one frontend of the session</span>
  <span id="status">connecting…</span>
</header>
<main>
  <section id="log" aria-live="polite"></section>
  <aside id="panels"></aside>
</main>
<form id="composer">
  <textarea id="input" placeholder="Ask the agent… (Enter to send, Shift+Enter for a new line)" aria-label="Prompt"></textarea>
  <button type="button" id="stop">Stop</button>
  <button class="primary" type="submit">Send</button>
</form>
<dialog id="dialog"></dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
